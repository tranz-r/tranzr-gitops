name: Conventional Commitlint

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    name: Conventional Commitlint
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main for ancestor audit
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned commitlint CLI (PyPI 1.3.0 / action v1.3.0)
        run: python -m pip install --quiet --disable-pip-version-check 'commitlint==1.3.0'

      - name: Lint commits in trusted event range
        # Event SHAs via env (not shell-interpolated untrusted refs).
        # pull_request only (not pull_request_target).
        # Historical exception: exact SHA 7c91ac878c344c53bb385c57bc8c8e75ac5eef06
        # (Develop #44), only when confirmed ancestor of origin/main — already
        # accepted on main; re-linting blocks ancestry-repair PRs. Same title on
        # any other SHA still fails. No blanket main-commit filter.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: python .github/scripts/lint_commits.py
