{{- if .Values.deployments.phonon.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.deployments.phonon.name }}-ingress
  namespace: {{ .Release.Namespace | default .Values.namespaceOverride }}
  labels:
    app.kubernetes.io/name: {{ include "tranzrmoves.name" . }}-phonon
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: phonon
    helm.sh/chart: {{ include "tranzrmoves.chart" . }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tranzrmoves.name" . }}-phonon
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: phonon
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "tranzrmoves.name" . }}-backend
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.deployments.phonon.containerPort }}
{{- end }}
