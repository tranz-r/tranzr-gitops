{{- if .Values.deployments.vroom.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.deployments.vroom.name }}
  namespace: {{ .Release.Namespace | default .Values.namespaceOverride }}
  labels:
    app.kubernetes.io/name: {{ include "tranzrmoves.name" . }}-vroom
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vroom
    {{- include "tranzrmoves.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tranzrmoves.name" . }}-vroom
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: vroom
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "tranzrmoves.name" . }}-backend
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.deployments.vroom.containerPort }}
  # Deny all egress (complete custom matrices; no OSRM/internet routing).
  egress: []
{{- end }}
