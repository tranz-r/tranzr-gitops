{{- if .Values.jobs.notificationsDbMigration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tranzrmoves.fullname" . }}-notifications-db-migration
  labels:
    {{- include "tranzrmoves.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifications-db-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
spec:
  backoffLimit: {{ .Values.jobs.notificationsDbMigration.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        {{- include "tranzrmoves.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: notifications-db-migration
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      ttlSecondsAfterFinished: 3600
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tranzrmoves.serviceAccountName" . }}
      restartPolicy: {{ .Values.jobs.notificationsDbMigration.restartPolicy }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        - name: postgresql-connectivity-check
          image: postgres:15-alpine
          command:
            - /bin/sh
            - -c
            - |
              echo "Constructing PostgreSQL hostname..."
              export POSTGRESQL_HOST=$TRANZR_SUPABASE_DATABASE_HOST
              export POSTGRESQL_PORT=$TRANZR_SUPABASE_DATABASE_PORT
              echo "Using host: $POSTGRESQL_HOST"
              echo "Checking PostgreSQL connectivity..."
              until pg_isready -h $POSTGRESQL_HOST -p $POSTGRESQL_PORT; do
                echo "PostgreSQL is not ready yet. Waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            {{- range .Values.jobs.dbMigration.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range .Values.jobs.dbMigration.envFromSecrets }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalSecrets.name }}
                  key: {{ .secretKey }}
            {{- end }}
          resources:
            {{- toYaml .Values.jobs.notificationsDbMigration.initContainer.resources | nindent 12 }}

      containers:
        - name: notifications-db-migrator
          image: {{ include "tranzrmoves.imageRef" (dict "root" . "key" "notificationsDbMigrator") | quote }}
          imagePullPolicy: {{ include "tranzrmoves.imagePullPolicy" . }}
          {{- if or .Values.jobs.dbMigration.env .Values.jobs.dbMigration.envFromSecrets }}
          env:
            {{- range .Values.jobs.dbMigration.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range .Values.jobs.dbMigration.envFromSecrets }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalSecrets.name }}
                  key: {{ .secretKey }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.jobs.notificationsDbMigration.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
