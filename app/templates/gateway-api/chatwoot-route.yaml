{{- if .Values.gatewayApi.enabled }}
{{- $g := .Values.gatewayApi.gateway }}
{{- $r := .Values.gatewayApi.routes.chatwoot }}
{{- $gatewayNamespace := default (.Release.Namespace | default .Values.namespaceOverride) $g.namespace }}
{{- $routeNamespace := default (.Release.Namespace | default .Values.namespaceOverride) $r.namespace }}
{{- $sectionNames := default (list "https") $r.sectionNames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $r.name }}
  namespace: {{ $routeNamespace }}
spec:
  parentRefs:
{{- range $sectionNames }}
    - name: {{ $g.name }}
      namespace: {{ $gatewayNamespace }}
      sectionName: {{ . }}
{{- end }}
  hostnames:
    - {{ $r.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $r.serviceName }}
          port: {{ $r.servicePort }}
{{- end }}
