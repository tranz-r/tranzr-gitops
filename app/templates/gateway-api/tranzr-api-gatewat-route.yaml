{{- if .Values.gatewayApi.enabled }}
{{- $g := .Values.gatewayApi.gateway }}
{{- $r := .Values.gatewayApi.routes.api }}
{{- $gatewayNamespace := default (.Release.Namespace | default .Values.namespaceOverride) $g.namespace }}
{{- $routeNamespace := default (.Release.Namespace | default .Values.namespaceOverride) $r.namespace }}
# Production edge: Gateway API (NGINX Gateway Fabric).
# WebSocket upgrades for SignalR (/hubs/tracking) are supported by default when the
# client sends Upgrade/Connection headers — no extra HTTPRoute match is required.
# See: https://docs.nginx.com/nginx-gateway-fabric/traffic-management/basic-routing/
# Sticky ClientIP on tranzr-gateway / tranzr-service + Redis SignalR backplane cover multi-replica.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $r.name }}
  namespace: {{ $routeNamespace }}
spec:
  parentRefs:
    - name: {{ $g.name }}
      namespace: {{ $gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ $r.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $r.serviceName }}
          port: {{ $r.servicePort }}
{{- end }}
