{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tranzrmoves.serviceAccountName" . }}
  labels:
    {{- include "tranzrmoves.labels" . | nindent 4 }}
  annotations:
    # PreSync so the SA exists before db-migration Jobs (hook-weight 0).
    # before-hook-creation only — do NOT use hook-succeeded. Argo CD defaults to
    # deleting Helm hooks after a successful sync, which removed trm-prod/trm-stg
    # and left chatwoot-k8s-secretstore InvalidProviderConfig ("unable to create client").
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
