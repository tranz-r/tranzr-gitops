# Staging environment overrides.
# Merged with values.yaml by the staging ApplicationSet (develop branch).
# Must match Argo CD Application destination namespace (staging_namespace in Terraform).
namespaceOverride: "tranzr-moves-staging"
# Short release name for staging to keep resource names (e.g. CronJobs) under length limits.
fullnameOverride: "trm-stg"

global:
  # Staging cluster: set both global.defaultStorageClass and pgcluster.cluster.storage.storageClass
  # to the StorageClass that exists on the staging cluster (can differ from production).
  defaultStorageClass: "synology-iscsi-delete-wffc"

ingress:
  enabled: false
  # Edge is Gateway API (labgrid-gateway @ 192.168.1.205) via NPM → http://.205:80.

pgcluster:
  cluster:
    storage:
      storageClass: "synology-iscsi-delete-wffc"

# Attach to labgrid Base Gateway listeners (http-tranzrmoves / https-tranzrmoves).
# NGF creates one LB per Gateway — both wildcards share labgrid-gateway @ .205.
# NPM: forward http://192.168.1.205:80, Force SSL off, Cloudflare Full.
gatewayApi:
  enabled: true
  gateway:
    create: false
    name: labgrid-gateway
    namespace: nginx-gateway
  routes:
    api:
      hostname: api.tranzrmoves.com
      serviceName: tranzr-gateway
      servicePort: 80
      sectionNames:
        - http-tranzrmoves
        - https-tranzrmoves
    chatwoot:
      hostname: chat.tranzrmoves.com
      serviceName: tranzr-moves-staging-chatwoot
      servicePort: 3000
      sectionNames:
        - http-tranzrmoves
        - https-tranzrmoves
    httpRedirect:
      # Empty: HTTP→HTTPS redirect loops when NPM forwards to :80.
      hostnames: []

observability:
  environment: staging

# Platform Redis/RabbitMQ: redis-system / rabbitmq-system on labgrid (same as hetzner-k3s production).
# Service DNS: redis.redis-system:6379, rabbitmq.rabbitmq-system:5672 — see platformMessaging in values.yaml.

deployments:
  # NOTE: this list *replaces* values.yaml deployments.backend.env (Helm merge).
  # Keep non-URL base env here so Mapbox/Speech/notifications stay intact.
  # Photo policy / MIME / AsyncQueue producer env come from shared helpers + values.yaml.
  backend:
    env:
      - name: LOG_LEVEL
        value: "debug"
      - name: PORT
        value: "8080"
      - name: NODE_ENV
        value: "production"
      - name: CACHE_TTL
        value: "300"
      - name: FROM_EMAIL
        value: "bookings@tranzrmoves.com"
      - name: FROM_NAME
        value: "Tranzzer Moves"
      - name: MAPBOX_BASE_URL
        value: "https://api.mapbox.com"
      - name: CHECKOUT_SESSION_SUCCESS_URL
        value: "https://tranzrmoves.com/checkout/success?session_id={CHECKOUT_SESSION_ID}"
      - name: CHECKOUT_SESSION_CANCEL_URL
        value: "https://tranzrmoves.com/checkout/cancel"
      - name: Notifications__UseDurableMessaging
        value: "true"
      - name: BusinessPortal__QuoteJourneyBaseUrl
        value: "https://tranzrmoves.com/moves"
      - name: BusinessPortal__PortalBaseUrl
        value: "https://portal.tranzrmoves.com"
      - name: WebPush__Subject
        value: "mailto:ops@tranzzer.com"
      - name: SpeechInventory__SttBaseUrl
        value: "http://tranzr-whisper-stt"
      - name: SpeechInventory__MaxDurationSeconds
        value: "15"
      - name: SpeechInventory__HardCeilingSeconds
        value: "20"
      - name: SpeechInventory__SttTimeoutSeconds
        value: "45"
  # NOTE: list replaces values.yaml deployments.workerProcessor.env.
  workerProcessor:
    env:
      - name: CHECKOUT_SESSION_SUCCESS_URL
        value: "https://tranzrmoves.com/checkout/success?session_id={CHECKOUT_SESSION_ID}"
      - name: CHECKOUT_SESSION_CANCEL_URL
        value: "https://tranzrmoves.com/checkout/cancel"
      - name: Notifications__UseDurableMessaging
        value: "true"
  workerScheduler:
    e2eDataPurge:
      Enabled: true
    # SEO-29 Fake Gate D — master + stages on; providers Enabled + UseFake (no AKV yet).
    # Apply SEO EF migrations before/with the SEO image deploy. Live SEO AKV keys
    # are production-only (values-production additionalApplicationSecrets); staging
    # stays Fake — do not require staging vault SEO secrets.
    # Checklist: tranzr-moves-services/documents/seo/deployment-runbooks-seo30.md
    seo:
      Enabled: true
      ImportEnabled: true
      DiscoveryEnabled: true
      GenerationEnabled: true
    seoDataForSeo:
      Enabled: true
      UseFake: true
    seoDeepSeek:
      Enabled: true
      UseFake: true
    seoSearchConsole:
      Enabled: true
      UseFake: true
    seoWordPress:
      Enabled: true
      UseFake: true
    seoPostHogImport:
      Enabled: true
      UseFake: true
  notifications:
    enabled: true

jobs:
  notificationsDbMigration:
    enabled: true
  internalApiCronjob:
    enabled: false

chatwoot:
  serviceAccount:
    create: false
    name: trm-stg
  ingress:
    enabled: false
  # Enable internal bundled Postgres & Redis
  postgresql:
    enabled: true
    primary:
      persistence:
        storageClass: synology-iscsi-delete-wffc
        size: 10Gi
  redis:
    enabled: true
    master:
      persistence:
        storageClass: synology-iscsi-delete-wffc
