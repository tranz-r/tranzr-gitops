# Staging environment overrides.
# Merged with values.yaml by the staging ApplicationSet (develop branch).
# Must match Argo CD Application destination namespace (staging_namespace in Terraform).
namespaceOverride: "tranzr-moves-staging"
# Short release name for staging to keep resource names (e.g. CronJobs) under length limits.
fullnameOverride: "trm-stg"

global:
  # Staging cluster: set both global.defaultStorageClass and pgcluster.cluster.storage.storageClass
  # to the StorageClass that exists on the staging cluster (can differ from production).
  defaultStorageClass: "synology-iscsi-delete-wffc"

ingress:
  enabled: false
  # Edge is Gateway API (labgrid-gateway @ 192.168.1.205) via NPM → http://.205:80.

pgcluster:
  cluster:
    storage:
      storageClass: "synology-iscsi-delete-wffc"

# Attach to labgrid Base Gateway listeners (http-tranzrmoves / https-tranzrmoves).
# NGF creates one LB per Gateway — both wildcards share labgrid-gateway @ .205.
# NPM: forward http://192.168.1.205:80, Force SSL off, Cloudflare Full.
gatewayApi:
  enabled: true
  gateway:
    create: false
    name: labgrid-gateway
    namespace: nginx-gateway
  routes:
    api:
      hostname: api.tranzrmoves.com
      serviceName: tranzr-gateway
      servicePort: 80
      sectionNames:
        - http-tranzrmoves
        - https-tranzrmoves
    chatwoot:
      hostname: chat.tranzrmoves.com
      serviceName: tranzr-moves-staging-chatwoot
      servicePort: 3000
      sectionNames:
        - http-tranzrmoves
        - https-tranzrmoves
    httpRedirect:
      # Empty: HTTP→HTTPS redirect loops when NPM forwards to :80.
      hostnames: []

observability:
  environment: staging

# Platform Redis/RabbitMQ: redis-system / rabbitmq-system on labgrid (same as hetzner-k3s production).
# Service DNS: redis.redis-system:6379, rabbitmq.rabbitmq-system:5672 — see platformMessaging in values.yaml.

deployments:
  workerScheduler:
    e2eDataPurge:
      Enabled: true
  notifications:
    enabled: true

jobs:
  notificationsDbMigration:
    enabled: true
  internalApiCronjob:
    enabled: false

chatwoot:
  serviceAccount:
    create: false
    name: trm-stg
  ingress:
    enabled: false
  # Enable internal bundled Postgres & Redis
  postgresql:
    enabled: true
    primary:
      persistence:
        storageClass: synology-iscsi-delete-wffc
        size: 10Gi
  redis:
    enabled: true
    master:
      persistence:
        storageClass: synology-iscsi-delete-wffc
