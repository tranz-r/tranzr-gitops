# Default values for tranzrmoves.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings (override per env in values-production.yaml / values-staging.yaml)
global:
  defaultStorageClass: "synology-iscsi-delete-wffc"

# Namespace override
namespaceOverride: "tranzr-moves"

# Container images — bump movesVersion once for backend, worker, migrators, and notifications (same CI release)
images:
  pullPolicy: IfNotPresent
  movesVersion: "0.77.0"
  gateway:
    repository: ghcr.io/tranz-r/api-gateway
    tag: "0.34.0"
  movesServices:
    repository: ghcr.io/tranz-r/tranzr-moves-services
  movesWorker:
    repository: ghcr.io/tranz-r/tranzr-moves-worker
  dbMigrator:
    repository: ghcr.io/tranz-r/tranzr-moves-db-migrator
  notifications:
    repository: ghcr.io/tranz-r/tranzr-moves-notifications
  notificationsDbMigrator:
    repository: ghcr.io/tranz-r/notifications-db-migrator

# Gateway API (Gateway + HTTPRoute) — production creates Gateway; staging attaches to labgrid Base.
gatewayApi:
  enabled: false
  gateway:
    # When false, only HTTPRoutes are rendered (labgrid owns tranzrmoves-gateway).
    create: true
    name: tranzr-gateway
    namespace: ""
    className: nginx
    clusterIssuer: tranzr-letsencrypt-production
    # Hostname pattern for both HTTP and HTTPS listeners (e.g. wildcard)
    hostname: "*.tranzzer.com"
    tlsSecretName: tranzr-wildcard-tls
  routes:
    chatwoot:
      name: tranzr-chatwoot-route
      namespace: ""
      hostname: chat.tranzzer.com
      serviceName: tranzr-moves-chatwoot
      servicePort: 3000
      # Prod: https only (http listener has RequestRedirect). Staging NPM→:80 needs http too.
      sectionNames:
        - https
    httpRedirect:
      name: http-to-https-redirect
      hostnames:
        - api.tranzzer.com
        - gateway.tranzzer.com
      # 301/302: many clients follow redirects with GET (POST body dropped). 308 preserves method+body.
      redirectStatusCode: 308
    api:
      name: tranzr-api
      namespace: ""
      hostname: api.tranzzer.com
      serviceName: tranzr-gateway
      servicePort: 80
      sectionNames:
        - https

# Deployments configuration
deployments:
  gateway:
    name: tranzr-gateway
    enabled: true
    replicaCount: 1
    # image: see images.gateway

    # Container port configuration
    containerPort: 8080

    # Regular environment variables (plain values)
    env:
      - name: LOG_LEVEL
        value: "info"
      - name: PORT
        value: "8080"
      - name: NODE_ENV
        value: "production"
      - name: Cors__AllowedOrigins__0
        value: "https://www.tranzrmoves.com"
      - name: Cors__AllowedOrigins__1
        value: "https://tranzrmoves.com"
      - name: Cors__AllowedOrigins__2
        value: "https://app.tranzrmoves.com"
      - name: Cors__AllowedOrigins__3
        value: "https://portal.tranzrmoves.com"
      - name: Cors__AllowedOrigins__4
        value: "https://admin.tranzrmoves.com"
      - name: Cors__AllowedOrigins__5
        value: "https://drivers.tranzrmoves.com"

    # Environment variables from External Secrets
    envFromSecrets:
      - name: SUPABASE_JWT_ISSUER
        secretKey: supabase-jwt-issuer

    # Resource configuration
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

    # Probes configuration
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 30
      periodSeconds: 10

    readinessProbe:
      httpGet:
        path: /ready
        port: http
      initialDelaySeconds: 15
      periodSeconds: 15

    # Autoscaling configuration
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

  backend:
    name: tranzr-service
    enabled: true
    replicaCount: 1
    # image: see images.movesServices + images.movesVersion

    # Container port configuration
    containerPort: 8080

    # Regular environment variables (plain values)
    env:
      - name: LOG_LEVEL
        value: "debug"
      - name: PORT
        value: "8080"
      - name: NODE_ENV
        value: "production"
      - name: CACHE_TTL
        value: "300"
      - name: FROM_EMAIL
        value: "bookings@tranzrmoves.com"
      - name: FROM_NAME
        value: "Tranzzer Moves"
      - name: MAPBOX_BASE_URL
        value: "https://api.mapbox.com"
      - name: CHECKOUT_SESSION_SUCCESS_URL
        value: "https://tranzrmoves.com/checkout/success?session_id={CHECKOUT_SESSION_ID}"
      - name: CHECKOUT_SESSION_CANCEL_URL
        value: "https://tranzrmoves.com/checkout/cancel"
      - name: Notifications__UseDurableMessaging
        value: "true"
      - name: BusinessPortal__QuoteJourneyBaseUrl
        value: "https://tranzrmoves.com/moves"
      - name: BusinessPortal__PortalBaseUrl
        value: "https://portal.tranzrmoves.com"
      - name: WebPush__Subject
        value: "mailto:ops@tranzzer.com"

    # Environment variables from External Secrets
    envFromSecrets:
      - name: STRIPE_API_KEY
        secretKey: tranzr-stripe-api-key
      - name: SUPABASE_URL
        secretKey: supabase-url
      - name: SUPABASE_JWT_ISSUER
        secretKey: supabase-jwt-issuer
      - name: SUPABASE_SECRET_KEY
        secretKey: supabase-secret-key
      - name: BUSINESS_PORTAL_INVITE_REDIRECT_URL
        secretKey: business-portal-invite-redirect-url
      - name: TRANZR_STRIPE_WEBHOOK_SIGNING_SECRET_V2
        secretKey: tranzr-stripe-webhook-signing-secret-v2
      - name: ConnectionStrings__TranzrMovesDatabaseConnection
        secretKey: tranzr-supabase-database-connection-string
      - name: MAPBOX_TOKEN
        secretKey: mapbox-token
      - name: AZURE_STORAGE_CONNECTION_STRING
        secretKey: tranzr-azure-storage-connection-string
      - name: TURNSTILE_SECRET_KEY
        secretKey: cloudflare-turnstile-secret-key
      - name: WebPush__VapidPublicKey
        secretKey: tranzr-webpush-vapid-public-key
      - name: WebPush__VapidPrivateKey
        secretKey: tranzr-webpush-vapid-private-key

    # Resource configuration
    resources:
      requests:
        cpu: 300m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Probes configuration
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 30
      periodSeconds: 10

    readinessProbe:
      httpGet:
        path: /ready
        port: http
      initialDelaySeconds: 5
      periodSeconds: 5

    # Autoscaling configuration
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 15
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

  workerScheduler:
    name: tranzr-moves-worker-scheduler
    enabled: true
    replicaCount: 1
    # image: see images.movesWorker + images.movesVersion
    # Keys match .NET property names; template emits PayLater__* / QuoteReminders__* / E2eDataPurge__* env vars.
    payLater:
      RecoveryIntervalMinutes: 90
      UseDurableMessaging: true
      DepositChargeTimeZone: Europe/London
    quoteReminders:
      Enabled: true
      ScanIntervalMinutes: 60
      IdleHoursBeforeReminder: 24
      ReminderCooldownDays: 7
      FrontendBaseUrl: https://tranzrmoves.com
      ResumeTokenLifetimeDays: 30
      SendRemindersForBusinessQuotes: false
    # Staging enables this in values-staging.yaml. Keep false in production.
    e2eDataPurge:
      Enabled: false
      RunAtHour: 2
      RunAtMinute: 0
      TimeZoneId: Europe/London
      MinAgeHours: 6
      CreatedByValues:
        - e2e
      EmailDomain: tranzrmoves.com
      DryRun: false
    envFromSecrets:
      - name: ConnectionStrings__TranzrMovesDatabaseConnection
        secretKey: tranzr-supabase-database-connection-string
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    autoscaling:
      enabled: false

  workerProcessor:
    name: tranzr-moves-worker-processor
    enabled: true
    replicaCount: 2
    # image: see images.movesWorker + images.movesVersion
    payLater:
      UseDurableMessaging: true
    env:
      - name: CHECKOUT_SESSION_SUCCESS_URL
        value: "https://tranzrmoves.com/checkout/success?session_id={CHECKOUT_SESSION_ID}"
      - name: CHECKOUT_SESSION_CANCEL_URL
        value: "https://tranzrmoves.com/checkout/cancel"
      - name: Notifications__UseDurableMessaging
        value: "true"
    envFromSecrets:
      - name: ConnectionStrings__TranzrMovesDatabaseConnection
        secretKey: tranzr-supabase-database-connection-string
      - name: STRIPE_API_KEY
        secretKey: tranzr-stripe-api-key
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

  notifications:
    name: tranzr-moves-notifications
    enabled: true
    replicaCount: 1
    # image: see images.notifications + images.movesVersion
    containerPort: 8080
    env:
      - name: Notifications__EmailProvider
        value: Acs
      - name: Notifications__UseDurableMessaging
        value: "true"
      - name: WebPush__Subject
        value: "mailto:ops@tranzzer.com"
    envFromSecrets:
      - name: ConnectionStrings__TranzrMovesDatabaseConnection
        secretKey: tranzr-supabase-database-connection-string
      - name: COMMUNICATION_SERVICES_CONNECTION_STRING
        secretKey: tranzr-communication-services-connection-string
      - name: WebPush__VapidPublicKey
        secretKey: tranzr-webpush-vapid-public-key
      - name: WebPush__VapidPrivateKey
        secretKey: tranzr-webpush-vapid-private-key
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 15
      periodSeconds: 15

# Image pull secrets configuration
imagePullSecrets:
  - name: github-registry-secret

# Service accounts configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod configuration
podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Services configuration
services:
  gateway:
    name: tranzr-gateway
    type: ClusterIP
    port: 80
    targetPort: 8080
    protocol: TCP
    # Stick clients to one gateway pod so SignalR negotiate + transport stay aligned
    # (YARP then sees a stable source IP toward the backend Service).
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 10800

  backend:
    name: tranzr-service
    type: ClusterIP
    port: 80
    targetPort: 8080
    protocol: TCP
    # SignalR connection state is per-pod; affinity + Redis backplane cover scale-out.
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 10800

  notifications:
    name: tranzr-moves-notifications
    type: ClusterIP
    port: 80
    targetPort: 8080
    protocol: TCP

# Ingress configuration (staging / labgrid — production uses Gateway API instead).
# ingress-nginx upgrades WebSockets when Upgrade/Connection headers are present;
# long timeouts + cookie affinity keep SignalR negotiate + transport on one gateway pod.
# See: https://kubernetes.github.io/ingress-nginx/user-guide/miscellaneous/websocket/
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "tranzr-letsencrypt-production"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # SignalR / WebSocket (TrackingHub at /hubs/tracking)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "tranzr-api-sticky"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
  hosts:
    - host: api.tranzrmoves.com
      paths:
        - path: /
          pathType: Prefix
          serviceName: tranzr-gateway
          servicePort: 80
  tls: []
    # - secretName: tranzr-gateway-tls
    #   hosts:
    #     - api.tranzrmoves.com

# OpenTelemetry export to in-cluster Grafana Alloy (monitoring-system).
observability:
  enabled: true
  otlpEndpoint: http://monitoring-alloy.monitoring-system.svc.cluster.local:4317
  otlpProtocol: grpc
  environment: production

# Platform Redis/RabbitMQ — cluster DNS in redis-system / rabbitmq-system (see hetzner-k3s / labgrid).
# Passwords only: platform-redis-password / platform-rabbitmq-password (same AKV keys as platform charts).
# Connection strings are assembled at container start from these hosts + synced passwords.
platformMessaging:
  enabled: true
  redis:
    host: redis.redis-system.svc.cluster.local
    port: 6379
  rabbitmq:
    host: rabbitmq.rabbitmq-system.svc.cluster.local
    port: 5672
    username: admin

# Consolidated External Secrets configuration
externalSecrets:
  enabled: true
  name: tranzrmoves-secrets
  refreshInterval: "1h"
  secretStoreRef:
    name: azure-kv-cluster-store
    kind: ClusterSecretStore

  # GitHub registry configuration
  githubRegistry:
    usernameKey: github-registry-username
    tokenKey: github-registry-token

  # Create separate image pull secret (dockerconfigjson type)
  createImagePullSecret: true

  # Application secrets - add all your application secrets here
  # Simple direct mapping from Azure Key Vault to Kubernetes secret
  applicationSecrets:
    # Backend secrets
    - secretKey: tranzr-stripe-api-key
      description: "Stripe API key for payment processing"
      remoteRef:
        key: tranzr-stripe-api-key

    # Supabase Secrets
    - secretKey: supabase-url
      description: "Supabase database URL"
      remoteRef:
        key: supabase-url
    - secretKey: supabase-jwt-issuer
      description: "Supabase JWT issuer"
      remoteRef:
        key: supabase-jwt-issuer
    - secretKey: supabase-secret-key
      description: "Supabase secret key"
      remoteRef:
        key: supabase-secret-key

    - secretKey: tranzr-stripe-webhook-signing-secret-v2
      description: "Stripe webhook signing secret for staging (or rotation)"
      remoteRef:
        key: tranzr-stripe-webhook-signing-secret-v2
    - secretKey: mapbox-token
      description: "Mapbox token"
      remoteRef:
        key: mapbox-token
    - secretKey: tranzr-azure-storage-connection-string
      description: "Azure storage connection string"
      remoteRef:
        key: tranzr-azure-storage-connection-string
    - secretKey: tranzr-communication-services-connection-string
      description: "Communication services connection string"
      remoteRef:
        key: tranzr-communication-services-connection-string
    - secretKey: cloudflare-turnstile-secret-key
      description: "Cloudflare turnstile secret key"
      remoteRef:
        key: cloudflare-turnstile-secret-key

    # Web Push VAPID (Drivers Portal assignment alerts)
    # Create in Azure Key Vault before sync:
    #   az keyvault secret set --vault-name <vault> --name tranzr-webpush-vapid-public-key --value '...'
    #   az keyvault secret set --vault-name <vault> --name tranzr-webpush-vapid-private-key --value '...'
    - secretKey: tranzr-webpush-vapid-public-key
      description: "Web Push VAPID public key (Drivers Portal)"
      remoteRef:
        key: tranzr-webpush-vapid-public-key
    - secretKey: tranzr-webpush-vapid-private-key
      description: "Web Push VAPID private key (Drivers Portal) — sensitive"
      remoteRef:
        key: tranzr-webpush-vapid-private-key

    # Database secrets
    - secretKey: tranzr-supabase-database-connection-string
      description: "PostgreSQL database connection string"
      remoteRef:
        key: tranzr-supabase-database-connection-string
    - secretKey: tranzr-supabase-database-host
      description: "PostgreSQL database host"
      remoteRef:
        key: tranzr-supabase-database-host

    # Platform Redis/RabbitMQ passwords (same AKV keys as hetzner-k3s / labgrid platform charts)
    - secretKey: platform-redis-password
      description: "Platform Redis password"
      remoteRef:
        key: platform-redis-password
    - secretKey: platform-rabbitmq-password
      description: "Platform RabbitMQ password"
      remoteRef:
        key: platform-rabbitmq-password

    - secretKey: business-portal-invite-redirect-url
      description: "Business portal invite redirect URL"
      remoteRef:
        key: business-portal-invite-redirect-url

# Node selector, tolerations, and affinity
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - tranzrmoves
          topologyKey: kubernetes.io/hostname

# Jobs configuration
jobs:
  dbMigration:
    enabled: true
    backoffLimit: 3
    # image: see images.dbMigrator + images.movesVersion
    restartPolicy: Never
    database:
      port: 5432

    # Init container resources
    initContainer:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Main container resources
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Regular environment variables (plain values)
    env:
      - name: ASPNETCORE_ENVIRONMENT
        value: "Production"
      - name: LOG_LEVEL
        value: "Information"
      - name: TRANZR_SUPABASE_DATABASE_PORT
        value: "5432"

    # Environment variables from External Secrets
    envFromSecrets:
      - name: DB_CONNECTION_STRING
        secretKey: tranzr-supabase-database-connection-string
      - name: TRANZR_SUPABASE_DATABASE_HOST
        secretKey: tranzr-supabase-database-host

  notificationsDbMigration:
    enabled: true
    backoffLimit: 3
    restartPolicy: Never
    # Uses jobs.dbMigration.env and envFromSecrets (same Postgres database)
    initContainer:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  internalApiCronjob:
    enabled: true
    schedule: "*/10 * * * *" # Every 10 minutes
    concurrencyPolicy: Allow
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    suspend: false
    backoffLimit: 3
    restartPolicy: OnFailure
    image:
      repository: curlimages/curl
      tag: "8.16.0"
      pullPolicy: IfNotPresent
    args:
      - -s
      - -X
      - POST
      - http://tranzr-service/api/v1/checkout/pay-later-collection
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Additional volumes and volume mounts
# A writable temp dir is required under the read-only root filesystem so that
# Chromium (server-side confirmation PDF rendering) can create its profile.
volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

chatwoot:
  # Enable internal bundled Postgres & Redis
  postgresql:
    enabled: true
    primary:
      persistence:
        storageClass: synology-iscsi-delete-wffc
        size: 10Gi
  redis:
    enabled: true
    master:
      persistence:
        storageClass: synology-iscsi-delete-wffc

  hooks:
    migrate:
      hookAnnotation: "post-install,post-upgrade"

  # Reference to existing Kubernetes Secret that holds all environment variables.
  # This Secret should contain keys like:
  #   POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USERNAME, POSTGRES_PASSWORD,
  #   REDIS_HOST, REDIS_PASSWORD, SECRET_KEY_BASE, SMTP_ADDRESS, SMTP_USERNAME, SMTP_PASSWORD
  existingEnvSecret: chatwoot-env-secrets

  # Non-sensitive environment configuration
  env:
    RAILS_ENV: production
    INSTALLATION_ENV: helm
    ACTIVE_STORAGE_SERVICE: microsoft # https://developers.chatwoot.com/self-hosted/deployment/storage/supported-providers
    ENABLE_ACCOUNT_SIGNUP: "false" # disable public signup
    # FORCE_SSL: "true"
    FRONTEND_URL: "https://chat.tranzrmoves.com"
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_MAX_THREADS: "5"
    USE_INBOX_AVATAR_FOR_BOT: "true"
    MAILER_SENDER_EMAIL: "tranzrchat@tranzrmoves.com"

    ENABLE_RACK_ATTACK: "false"
    ENABLE_RACK_ATTACK_WIDGET_API: "false"

    # SMTP Configuration - Fixed values
    SMTP_ADDRESS: "smtp.azurecomm.net"
    SMTP_PORT: "587"
    SMTP_DOMAIN: "tranzrmoves.com"
    SMTP_AUTHENTICATION: "login"
    SMTP_ENABLE_STARTTLS_AUTO: "true"
    SMTP_OPENSSL_VERIFY_MODE: "none"
    # Note: Removed SMTP_SSL and SMTP_TLS to avoid conflicts with STARTTLS on port 587

    # Azure Storage Configuration
    AZURE_STORAGE_CONTAINER: "chatwoot"
    AZURE_STORAGE_ACCOUNT_NAME: "tranzrmovessa"

    BRAND_NAME: "Tranzzer Moves"
    INSTALLATION_NAME: "Tranzzer Moves Chat"

  # Internal service configuration (ClusterIP)
  services:
    name: chatwoot
    type: ClusterIP
    internalPort: 3000
    targetPort: 3000

  service:
    type: ClusterIP
    port: 80

  # Ingress configuration (adjust to your ingress controller)
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      cert-manager.io/cluster-issuer: "tranzr-letsencrypt-production"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      # WebSocket support - enable WebSocket upgrade
      nginx.ingress.kubernetes.io/websocket-services: "tranzr-moves-chatwoot"
      # Increase timeouts for long-lived WebSocket connections
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
      # Disable buffering for WebSocket (critical for real-time communication)
      # Note: This may affect large file uploads, but is required for WebSocket
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      # Use HTTP/1.1 for WebSocket support (required)
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
      # Keep connections alive for better WebSocket performance
      nginx.ingress.kubernetes.io/upstream-keepalive-connections: "50"
      nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "60"
      nginx.ingress.kubernetes.io/upstream-keepalive-requests: "100"
      # Session affinity for WebSocket (important with multiple replicas)
      # Required for WebSocket to maintain connection to same pod
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/session-cookie-name: "chatwoot-sticky"
      nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
      nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
      nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
      nginx.ingress.kubernetes.io/session-cookie-path: "/"
    hosts:
      - host: chat.tranzrmoves.com
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tranzr-moves-staging-chatwoot
                port:
                  number: 3000
    tls: []

  # --- External Secrets configuration ---
  externalSecrets:
    enabled: true
    name: chatwoot-env-secrets
    refreshInterval: "1h"
    secretStoreRef:
      name: azure-kv-cluster-store
      kind: ClusterSecretStore

    # Chatwoot secrets - add your chatwoot-specific secrets here
    secrets:
      - secretKey: SECRET_KEY_BASE
        description: "Chatwoot secret key base"
        remoteRef:
          key: chatwoot-secret-key-base

      # SMTP secrets
      - secretKey: SMTP_USERNAME
        description: "Chatwoot SMTP username"
        remoteRef:
          key: acs-smtp-username
      - secretKey: SMTP_PASSWORD
        description: "Chatwoot SMTP password"
        remoteRef:
          key: acs-smtp-password

      # Azure Blob Storage secrets
      - secretKey: AZURE_STORAGE_ACCESS_KEY
        description: "Azure Blob Storage access key"
        remoteRef:
          key: chatwoot-azure-storage-access-key

  secretStore:
    enabled: true
    name: chatwoot-k8s-secretstore
