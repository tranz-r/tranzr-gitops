# Production environment overrides.
# Merged with values.yaml by the production ApplicationSet (main branch).

fullnameOverride: "trm-prod"

# Apps use transaction pooler; migrators keep session via jobs.*.envFromSecrets.
# Port / pool size / No Reset On Close are set here (not in AKV) and appended at container start.
database:
  appConnectionSecretKey: tranzr-supabase-transaction-database-connection-string
  appConnectionPort: 6543
  appMaximumPoolSize: 3
  appNoResetOnClose: true

externalSecrets:
  additionalApplicationSecrets:
    - secretKey: tranzr-supabase-transaction-database-connection-string
      description: "Supabase transaction pooler connection string (apps)"
      remoteRef:
        key: tranzr-supabase-transaction-database-connection-string
    # SEO-30 — production vault (tranzr-moves); staging Fake Gate D does not use these.
    - secretKey: tranzr-seo-dataforseo-login
      description: "DataForSEO API login (SEO worker Scheduler)"
      remoteRef:
        key: tranzr-seo-dataforseo-login
    - secretKey: tranzr-seo-dataforseo-password
      description: "DataForSEO API password (SEO worker Scheduler)"
      remoteRef:
        key: tranzr-seo-dataforseo-password
    - secretKey: tranzr-seo-deepseek-api-key
      description: "DeepSeek API key (SEO worker Scheduler)"
      remoteRef:
        key: tranzr-seo-deepseek-api-key
    - secretKey: tranzr-seo-gsc-service-account-json
      description: "Google Search Console service account JSON (SEO worker Scheduler)"
      remoteRef:
        key: tranzr-seo-gsc-service-account-json
    - secretKey: tranzr-seo-wordpress-app-password
      description: "WordPress Application Password (SEO worker Scheduler)"
      remoteRef:
        key: tranzr-seo-wordpress-app-password
    - secretKey: tranzr-seo-posthog-personal-api-key
      description: "PostHog Personal API key for Query aggregates (SEO worker Scheduler)"
      remoteRef:
        key: tranzr-seo-posthog-personal-api-key
    - secretKey: tranzr-seo-posthog-project-api-key
      description: "PostHog project API key for seo.biz.v1 Capture (API host)"
      remoteRef:
        key: tranzr-seo-posthog-project-api-key

global:
  # Production cluster StorageClass (must exist on the prod cluster)
  defaultStorageClass: "hcloud-volumes"

features:
  webQuoteTurnstile:
    # Production activation requires a separate, explicit rollout decision.
    enabled: true
    allowedHostnames:
      - tranzzer.com
      - www.tranzzer.com

ingress:
  enabled: false

# Production uses Gateway API (not Ingress). NGF upgrades WebSockets by default;
# SignalR scale-out relies on Service sessionAffinity + Redis backplane on the API.

pgcluster:
  cluster:
    storage:
      # CNPG volumes: use same class as global.defaultStorageClass for prod
      storageClass: "hcloud-volumes"

gatewayApi:
  enabled: true
  # Override nested keys here as needed, e.g. gateway.hostname, routes.api.hostname

deployments:
  backend:
    replicaCount: 2
    # NOTE: this list *replaces* values.yaml deployments.backend.env (Helm merge).
    # Keep non-URL base env here or Mapbox/Speech/notifications break in prod.
    env:
      - name: LOG_LEVEL
        value: "debug"
      - name: PORT
        value: "8080"
      - name: NODE_ENV
        value: "production"
      - name: CACHE_TTL
        value: "300"
      - name: FROM_EMAIL
        value: "bookings@tranzrmoves.com"
      - name: FROM_NAME
        value: "Tranzzer Moves"
      # MAPBOX_BASE_URL is set in backend-deployment.yaml (outside this list).
      - name: CHECKOUT_SESSION_SUCCESS_URL
        value: "https://tranzzer.com/moves/checkout/success?session_id={CHECKOUT_SESSION_ID}"
      - name: CHECKOUT_SESSION_CANCEL_URL
        value: "https://tranzzer.com/moves/checkout/cancel"
      - name: Notifications__UseDurableMessaging
        value: "true"
      - name: BusinessPortal__QuoteJourneyBaseUrl
        value: "https://tranzzer.com/moves"
      - name: BusinessPortal__PortalBaseUrl
        value: "https://portal.tranzzer.com"
      - name: WebPush__Subject
        value: "mailto:ops@tranzzer.com"
      - name: SpeechInventory__SttBaseUrl
        value: "http://tranzr-whisper-stt"
      - name: SpeechInventory__MaxDurationSeconds
        value: "15"
      - name: SpeechInventory__HardCeilingSeconds
        value: "20"
      - name: SpeechInventory__SttTimeoutSeconds
        value: "45"
      # SEO-10 Capture — AKV project key wired; emits seo.biz.v1 after booking/payment/refund.
      - name: Seo__PostHog__Enabled
        value: "true"
      - name: Seo__PostHog__Host
        value: "https://eu.i.posthog.com"
    additionalEnvFromSecrets:
      - name: Seo__PostHog__ProjectApiKey
        secretKey: tranzr-seo-posthog-project-api-key

  whisperStt:
    replicaCount: 2
    autoscaling:
      minReplicas: 2
      maxReplicas: 5

  workerProcessor:
    env:
      - name: CHECKOUT_SESSION_SUCCESS_URL
        value: "https://tranzzer.com/moves/checkout/success?session_id={CHECKOUT_SESSION_ID}"
      - name: CHECKOUT_SESSION_CANCEL_URL
        value: "https://tranzzer.com/moves/checkout/cancel"

  workerScheduler:
    quoteReminders:
      FrontendBaseUrl: https://tranzzer.com
    e2eDataPurge:
      Enabled: false
    # SEO automation stays dark until Fake Gate D soak + live pilot; keys pre-wired from AKV.
    # Base values.yaml already has Enabled: false / UseFake: true; explicit here for clarity.
    seo:
      Enabled: false
      ImportEnabled: false
      DiscoveryEnabled: false
      GenerationEnabled: false
    seoPostHogImport:
      ProjectId: "279484"
      Host: https://eu.i.posthog.com
    additionalEnvFromSecrets:
      - name: Seo__DataForSEO__Login
        secretKey: tranzr-seo-dataforseo-login
      - name: Seo__DataForSEO__Password
        secretKey: tranzr-seo-dataforseo-password
      - name: Seo__DeepSeek__ApiKey
        secretKey: tranzr-seo-deepseek-api-key
      - name: Seo__SearchConsole__ServiceAccountJson
        secretKey: tranzr-seo-gsc-service-account-json
      - name: Seo__WordPress__ApplicationPassword
        secretKey: tranzr-seo-wordpress-app-password
      - name: Seo__PostHogImport__PersonalApiKey
        secretKey: tranzr-seo-posthog-personal-api-key

  # VisionNormalizer only: SESSION pooler keywords (advisory locks). Reuses root
  # appConnectionSecretKey (transaction secret name whose value is already SESSION host:5432).
  # Root database.appConnectionPort 6543 / pool 3 / NoReset true stay for API/other workers.
  # Orphan session locks already held by idle backends are NOT cleared by this deploy.
  workerVisionNormalizer:
    database:
      appConnectionPort: 5432
      appMaximumPoolSize: 3
      appNoResetOnClose: false

  gateway:
    env:
      - name: Cors__AllowedOrigins__0
        value: "https://www.tranzzer.com"
      - name: Cors__AllowedOrigins__1
        value: "https://tranzzer.com"
      - name: Cors__AllowedOrigins__2
        value: "https://app.tranzzer.com"
      - name: Cors__AllowedOrigins__3
        value: "https://portal.tranzzer.com"
      - name: Cors__AllowedOrigins__4
        value: "https://admin.tranzzer.com"
      - name: Cors__AllowedOrigins__5
        value: "https://drivers.tranzzer.com"

  notifications:
    enabled: true

jobs:
  notificationsDbMigration:
    enabled: true
  internalApiCronjob:
    enabled: false

chatwoot:
  hooks:
    migrate:
      hookAnnotation: "pre-install,post-upgrade"
  serviceAccount:
    create: false
    name: trm-prod
  ingress:
    enabled: false
  # Enable internal bundled Postgres & Redis
  postgresql:
    enabled: true
    primary:
      persistence:
        storageClass: hcloud-volumes
        size: 10Gi
  redis:
    enabled: true
    master:
      persistence:
        storageClass: hcloud-volumes

  env:
    FRONTEND_URL: "https://chat.tranzzer.com"
    MAILER_SENDER_EMAIL: "noreply@tranzzer.com"
    SMTP_DOMAIN: "tranzzer.com"
    BRAND_NAME: "Tranzzer Moves"
    INSTALLATION_NAME: "Tranzzer Moves Chat"
