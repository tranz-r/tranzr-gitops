# Production environment overrides.
# Merged with values.yaml by the production ApplicationSet (main branch).

fullnameOverride: "trm-prod"

global:
  # Production cluster StorageClass (must exist on the prod cluster)
  defaultStorageClass: "hcloud-volumes"

ingress:
  enabled: false

# Production uses Gateway API (not Ingress). NGF upgrades WebSockets by default;
# SignalR scale-out relies on Service sessionAffinity + Redis backplane on the API.

pgcluster:
  cluster:
    storage:
      # CNPG volumes: use same class as global.defaultStorageClass for prod
      storageClass: "hcloud-volumes"

gatewayApi:
  enabled: true
  # Override nested keys here as needed, e.g. gateway.hostname, routes.api.hostname

deployments:
  backend:
    replicaCount: 2
    env:
      - name: CHECKOUT_SESSION_SUCCESS_URL
        value: "https://tranzzer.com/moves/checkout/success?session_id={CHECKOUT_SESSION_ID}"
      - name: CHECKOUT_SESSION_CANCEL_URL
        value: "https://tranzzer.com/moves/checkout/cancel"
      - name: BusinessPortal__QuoteJourneyBaseUrl
        value: "https://tranzzer.com/moves"
      - name: BusinessPortal__PortalBaseUrl
        value: "https://portal.tranzzer.com"

  workerProcessor:
    env:
      - name: CHECKOUT_SESSION_SUCCESS_URL
        value: "https://tranzzer.com/moves/checkout/success?session_id={CHECKOUT_SESSION_ID}"
      - name: CHECKOUT_SESSION_CANCEL_URL
        value: "https://tranzzer.com/moves/checkout/cancel"

  workerScheduler:
    quoteReminders:
      FrontendBaseUrl: https://tranzzer.com
    e2eDataPurge:
      Enabled: false

  gateway:
    env:
      - name: Cors__AllowedOrigins__0
        value: "https://www.tranzzer.com"
      - name: Cors__AllowedOrigins__1
        value: "https://tranzzer.com"
      - name: Cors__AllowedOrigins__2
        value: "https://app.tranzzer.com"
      - name: Cors__AllowedOrigins__3
        value: "https://portal.tranzzer.com"
      - name: Cors__AllowedOrigins__4
        value: "https://admin.tranzzer.com"
      - name: Cors__AllowedOrigins__5
        value: "https://drivers.tranzzer.com"

  notifications:
    enabled: true

jobs:
  notificationsDbMigration:
    enabled: true
  internalApiCronjob:
    enabled: false

chatwoot:
  serviceAccount:
    create: false
    name: trm-prod
  ingress:
    enabled: false
  # Enable internal bundled Postgres & Redis
  postgresql:
    enabled: true
    primary:
      persistence:
        storageClass: hcloud-volumes
        size: 10Gi
  redis:
    enabled: true
    master:
      persistence:
        storageClass: hcloud-volumes

  env:
    FRONTEND_URL: "https://chat.tranzzer.com"
    MAILER_SENDER_EMAIL: "noreply@tranzzer.com"
    SMTP_DOMAIN: "tranzzer.com"
    BRAND_NAME: "Tranzzer Moves"
    INSTALLATION_NAME: "Tranzzer Moves Chat"
