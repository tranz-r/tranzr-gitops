# Production environment overrides.
# Merged with values.yaml by the production ApplicationSet (main branch).

fullnameOverride: "trm-prod"

# Apps use transaction pooler; migrators keep session via jobs.*.envFromSecrets.
# Port / pool size / No Reset On Close are set here (not in AKV) and appended at container start.
database:
  appConnectionSecretKey: tranzr-supabase-transaction-database-connection-string
  appConnectionPort: 6543
  appMaximumPoolSize: 3
  appNoResetOnClose: true

externalSecrets:
  additionalApplicationSecrets:
    - secretKey: tranzr-supabase-transaction-database-connection-string
      description: "Supabase transaction pooler connection string (apps)"
      remoteRef:
        key: tranzr-supabase-transaction-database-connection-string

global:
  # Production cluster StorageClass (must exist on the prod cluster)
  defaultStorageClass: "hcloud-volumes"

features:
  movesCalendarPricingV3:
    enabled: true
  webQuoteTurnstile:
    # Production activation requires a separate, explicit rollout decision.
    enabled: true
    allowedHostnames:
      - tranzzer.com
      - www.tranzzer.com

ingress:
  enabled: false

# Production uses Gateway API (not Ingress). NGF upgrades WebSockets by default;
# SignalR scale-out relies on Service sessionAffinity + Redis backplane on the API.

pgcluster:
  cluster:
    storage:
      # CNPG volumes: use same class as global.defaultStorageClass for prod
      storageClass: "hcloud-volumes"

gatewayApi:
  enabled: true
  # Override nested keys here as needed, e.g. gateway.hostname, routes.api.hostname

deployments:
  backend:
    replicaCount: 2
    # NOTE: this list *replaces* values.yaml deployments.backend.env (Helm merge).
    # Keep non-URL base env here or Mapbox/Speech/notifications break in prod.
    env:
      - name: LOG_LEVEL
        value: "debug"
      - name: PORT
        value: "8080"
      - name: NODE_ENV
        value: "production"
      - name: CACHE_TTL
        value: "300"
      - name: FROM_EMAIL
        value: "bookings@tranzrmoves.com"
      - name: FROM_NAME
        value: "Tranzzer Moves"
      # MAPBOX_BASE_URL is set in backend-deployment.yaml (outside this list).
      - name: CHECKOUT_SESSION_SUCCESS_URL
        value: "https://tranzzer.com/moves/checkout/success?session_id={CHECKOUT_SESSION_ID}"
      - name: CHECKOUT_SESSION_CANCEL_URL
        value: "https://tranzzer.com/moves/checkout/cancel"
      - name: Notifications__UseDurableMessaging
        value: "true"
      - name: BusinessPortal__QuoteJourneyBaseUrl
        value: "https://tranzzer.com/moves"
      - name: BusinessPortal__PortalBaseUrl
        value: "https://portal.tranzzer.com"
      - name: WebPush__Subject
        value: "mailto:ops@tranzzer.com"
      - name: SpeechInventory__SttBaseUrl
        value: "http://tranzr-whisper-stt"
      - name: SpeechInventory__MaxDurationSeconds
        value: "15"
      - name: SpeechInventory__HardCeilingSeconds
        value: "20"
      - name: SpeechInventory__SttTimeoutSeconds
        value: "45"

  whisperStt:
    replicaCount: 2
    autoscaling:
      minReplicas: 2
      maxReplicas: 5

  workerProcessor:
    env:
      - name: CHECKOUT_SESSION_SUCCESS_URL
        value: "https://tranzzer.com/moves/checkout/success?session_id={CHECKOUT_SESSION_ID}"
      - name: CHECKOUT_SESSION_CANCEL_URL
        value: "https://tranzzer.com/moves/checkout/cancel"

  workerScheduler:
    quoteReminders:
      FrontendBaseUrl: https://tranzzer.com
    e2eDataPurge:
      Enabled: false

  gateway:
    env:
      - name: Cors__AllowedOrigins__0
        value: "https://www.tranzzer.com"
      - name: Cors__AllowedOrigins__1
        value: "https://tranzzer.com"
      - name: Cors__AllowedOrigins__2
        value: "https://app.tranzzer.com"
      - name: Cors__AllowedOrigins__3
        value: "https://portal.tranzzer.com"
      - name: Cors__AllowedOrigins__4
        value: "https://admin.tranzzer.com"
      - name: Cors__AllowedOrigins__5
        value: "https://drivers.tranzzer.com"

  notifications:
    enabled: true

jobs:
  notificationsDbMigration:
    enabled: true
  internalApiCronjob:
    enabled: false

chatwoot:
  hooks:
    migrate:
      hookAnnotation: "pre-install,post-upgrade"
  serviceAccount:
    create: false
    name: trm-prod
  ingress:
    enabled: false
  # Enable internal bundled Postgres & Redis
  postgresql:
    enabled: true
    primary:
      persistence:
        storageClass: hcloud-volumes
        size: 10Gi
  redis:
    enabled: true
    master:
      persistence:
        storageClass: hcloud-volumes

  env:
    FRONTEND_URL: "https://chat.tranzzer.com"
    MAILER_SENDER_EMAIL: "noreply@tranzzer.com"
    SMTP_DOMAIN: "tranzzer.com"
    BRAND_NAME: "Tranzzer Moves"
    INSTALLATION_NAME: "Tranzzer Moves Chat"
